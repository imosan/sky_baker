[package]
name = "sky-baker"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "equirectangular HDRI (.exr) を KTX2 cubemap (Rgba16Float, mips付き) に焼くオフラインCLIツール"
publish = false

[dependencies]
wgpu = "27.0.1"
pollster = "0.4"
exr = "1.74.2"
half = "2.7.1"
bytemuck = "1.23.1"
anyhow = "1.0.104"
log = "0.4.21"
env_logger = "0.11"
clap = { version = "4.6.6", features = ["derive"] }
